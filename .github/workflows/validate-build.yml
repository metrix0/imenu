name: Validate before main merge

on:
  pull_request:
    branches:
      - main

concurrency:
  group: validate-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      CHECKOUT_TEST_DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:39201"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
      SUPABASE_URL: "http://127.0.0.1:39201"
      SUPABASE_ANON_KEY: "ci-placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder"
      OPENAI_API_KEY: "ci-placeholder"
      MERCADO_PAGO_ACCESS_TOKEN: "ci-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Critical-flow, payment and PostgreSQL regression tests
        run: npx jest --runInBand

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

      - name: Browser E2E — signup, menu, pickup checkout, payment selection
        run: |
          if command -v google-chrome >/dev/null; then
            export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          fi
          node tests/e2e/checkout.cjs
