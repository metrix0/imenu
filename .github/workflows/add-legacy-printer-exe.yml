name: Add Legacy Printer Installer

on:
  push:
    branches:
      - preview
    paths:
      - .github/workflows/add-legacy-printer-exe.yml

permissions:
  contents: write

jobs:
  build-and-add-installer:
    if: contains(github.event.head_commit.message, '[legacy-installer-bootstrap]')
    runs-on: windows-2022

    steps:
      - name: Checkout iMenu preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Checkout legacy printer source
        shell: pwsh
        run: git clone --depth 1 https://github.com/metrix0/imenu-printer-windows7-legacy.git legacy-printer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV

      - name: Install legacy dependencies
        working-directory: legacy-printer
        run: npm ci

      - name: Build legacy installer
        working-directory: legacy-printer
        run: npm run dist -- --publish never

      - name: Copy installer into iMenu
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "public/downloads" -Force | Out-Null
          Copy-Item "legacy-printer/dist/iMenu Impressora Legacy Setup 1.1.5.exe" "public/downloads/iMenu Impressora Legacy Setup 1.1.5.exe" -Force

      - name: Commit installer to preview
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "public/downloads/iMenu Impressora Legacy Setup 1.1.5.exe"
          git commit -m "Add Windows legacy printer installer"
          git push origin HEAD:preview
