name: Deploy VPS production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry a failed production release
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-vps-release.yml
    with:
      target: production
      retry_failed: ${{ inputs.retry_failed || false }}
    secrets:
      deploy_key: ${{ secrets.IMENU_PROD_DEPLOY_SSH_KEY }}
