name: Deploy VPS staging

on:
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry a failed preview release
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: deploy-vps-preview
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/preview'
    uses: ./.github/workflows/deploy-vps-release.yml
    with:
      target: preview
      retry_failed: ${{ inputs.retry_failed || false }}
    secrets:
      deploy_key: ${{ secrets.IMENU_STAGE_DEPLOY_SSH_KEY }}
