name: Cleanup merge-snapshot branches

on:
  schedule:
    # 03:00 America/Sao_Paulo (UTC-03).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report eligible snapshots without closing PRs or deleting branches'
        type: boolean
        required: false
        default: false
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merge-snapshots.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cleanup-merge-snapshots
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.head.ref, 'merge-snapshot-') ||
        github.event.pull_request.head.ref == 'temp-merge-snapshot-cleanup-20261104'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Safely close superseded Preview PRs and remove their snapshot branches
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const snapshotName = /^merge-snapshot-[0-9a-f]{40}$/;
            const dryRun = process.env.DRY_RUN === 'true';

            const [branches, openPRs, closedPRs] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'closed', per_page: 100 }),
            ]);

            const mergedSnapshots = closedPRs
              .filter(pr => pr.merged_at && pr.base.ref === 'main' && snapshotName.test(pr.head.ref)
                && pr.head.repo?.full_name === repoFullName)
              .sort((a, b) => Date.parse(b.merged_at) - Date.parse(a.merged_at));

            const belongsToBranch = (pr, name) => pr.head.ref === name
              && pr.head.repo?.full_name === repoFullName;
            const summaryRows = [];
            let deleted = 0;
            let closed = 0;
            let retained = 0;

            for (const branch of branches.filter(b => snapshotName.test(b.name))) {
              const name = branch.name;
              const candidatePRs = openPRs.filter(pr => belongsToBranch(pr, name));
              const completedPRs = closedPRs.filter(pr => belongsToBranch(pr, name) && pr.merged_at);
              let reason = '';
              let supersededBy = null;
              let eligible = false;

              if (branch.protected) {
                reason = 'Protected branch';
              } else if (candidatePRs.some(pr => pr.base.ref !== 'main' || pr.title !== 'Preview'
                  || pr.head.sha !== branch.commit.sha)) {
                reason = 'Open PR with different purpose or changed head';
              } else if (!candidatePRs.length && completedPRs.length) {
                eligible = true;
                reason = `PR #${completedPRs[0].number} already merged`;
              } else {
                // A PR is superseded only when a later merged snapshot includes
                // its exact head in commit ancestry (also works for squash merges).
                const oldestPRCreation = candidatePRs.length
                  ? Math.min(...candidatePRs.map(pr => Date.parse(pr.created_at))) : 0;
                for (const mergedPR of mergedSnapshots) {
                  if (mergedPR.head.ref === name || Date.parse(mergedPR.merged_at) < oldestPRCreation) continue;
                  try {
                    const { data: comparison } = await github.rest.repos.compareCommits({
                      owner, repo,
                      base: branch.commit.sha,
                      head: `refs/pull/${mergedPR.number}/head`,
                      per_page: 1,
                    });
                    if (comparison.behind_by === 0 &&
                        (comparison.status === 'ahead' || comparison.status === 'identical')) {
                      supersededBy = mergedPR.number;
                      eligible = true;
                      reason = `HEAD ancestor of merged PR #${mergedPR.number}`;
                      break;
                    }
                  } catch (error) {
                    // An API failure never authorizes deletion.
                    core.warning(`Could not compare ${name} with PR #${mergedPR.number}: ${error.message}`);
                  }
                }
                if (!eligible) reason = 'No verified merged successor; kept to protect work';
              }

              if (!eligible) {
                retained++;
                core.info(`KEEP ${name}: ${reason}`);
                summaryRows.push([name, 'Kept', reason]);
                continue;
              }

              // Recheck the branch HEAD and PRs before making changes.
              const { data: currentRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${name}` });
              if (currentRef.object.sha !== branch.commit.sha) {
                retained++;
                summaryRows.push([name, 'Kept', 'HEAD changed during cleanup']);
                continue;
              }
              const currentOpenPRs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', head: `${owner}:${name}`, per_page: 100,
              });
              if (currentOpenPRs.some(pr => pr.base.ref !== 'main' || pr.title !== 'Preview'
                  || pr.head.sha !== branch.commit.sha)) {
                retained++;
                summaryRows.push([name, 'Kept', 'New/changed PR detected']);
                continue;
              }

              if (dryRun) {
                core.info(`DRY RUN ${name}: ${reason}; would close ${currentOpenPRs.length} PR(s)`);
                summaryRows.push([name, 'Would delete', reason]);
                continue;
              }

              for (const pr of currentOpenPRs) {
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
                closed++;
                core.info(`Closed obsolete PR #${pr.number}; superseded by merged PR #${supersededBy}`);
              }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
              deleted++;
              core.info(`Deleted ${name}: ${reason}`);
              summaryRows.push([name, 'Deleted', reason]);
            }

            // Delete only the exact temporary branch used to install this workflow
            // after its PR is merged (never other temp branches).
            const bootstrap = 'temp-merge-snapshot-cleanup-20261104';
            if (context.eventName === 'pull_request' && context.payload.pull_request?.merged
                && context.payload.pull_request.head.ref === bootstrap
                && context.payload.pull_request.head.repo?.full_name === repoFullName) {
              if (!dryRun) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${bootstrap}` });
                  core.info(`Deleted bootstrap branch ${bootstrap}`);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            await core.summary
              .addHeading('Merge-snapshot cleanup')
              .addRaw(`Dry run: ${dryRun}. Deleted: ${deleted}. Closed obsolete PRs: ${closed}. Kept: ${retained}.`)
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Result', header: true }, { data: 'Reason', header: true }],
                ...summaryRows,
              ])
              .write();
