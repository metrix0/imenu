name: Sync legacy printer release to preview downloads

on:
  push:
    branches:
      - preview
    paths:
      - .legacy-printer-release-trigger.json

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: imenu-legacy-printer-download-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout preview
        uses: actions/checkout@v5
        with:
          ref: preview
          fetch-depth: 0

      - name: Read legacy release trigger
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' .legacy-printer-release-trigger.json)"
          UPDATED_AT="$(jq -r '.updatedAt' .legacy-printer-release-trigger.json)"
          RELEASE_URL="$(jq -r '.releaseUrl' .legacy-printer-release-trigger.json)"

          test -n "$VERSION"
          test "$VERSION" != "null"
          test -n "$RELEASE_URL"
          test "$RELEASE_URL" != "null"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub legacy installer and update metadata
        id: download
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPDATED_AT: ${{ steps.release.outputs.updated_at }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          FILE_NAME="iMenu Impressora Legacy Setup ${VERSION}.exe"
          export FILE_NAME
          mkdir -p public/downloads

          RELEASE_JSON="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "https://api.github.com/repos/metrix0/imenu-printer-windows7-legacy/releases/tags/v${VERSION}")"
          ASSET_SIZE="$(printf '%s' "$RELEASE_JSON" | jq -r --arg url "$RELEASE_URL" '[.assets[] | select(.browser_download_url == $url) | .size] | first // 0')"
          if [ "$ASSET_SIZE" -lt 1000000 ]; then
            echo "GitHub legacy release is missing the specified installer: $RELEASE_URL"
            exit 1
          fi

          # Preserve the URL expected by already installed legacy clients.
          ENCODED_NAME="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["FILE_NAME"]))')"
          jq -n \
            --arg version "${VERSION} Legacy" \
            --arg updatedAt "$UPDATED_AT" \
            --arg downloadUrl "/downloads/$ENCODED_NAME" \
            '{version:$version,updatedAt:$updatedAt,downloadUrl:$downloadUrl}' \
            > public/downloads/imenu-printer-legacy.json

      - name: Commit legacy download to preview
        id: commit_preview
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000

          git add -- public/downloads/imenu-printer-legacy.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update legacy printer download to ${VERSION}"

          for attempt in 1 2 3 4 5; do
            git fetch origin preview
            git rebase origin/preview

            if git -c http.version=HTTP/1.1 push origin HEAD:preview; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Could not push legacy printer download update to preview after 5 attempts."
          exit 1

      - name: Report legacy printer sync phases
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_preview.outcome }}
        run: |
          set -euo pipefail

          post_status() {
            local context="$1"
            local outcome="$2"
            local state="failure"
            if [ "$outcome" = "success" ]; then state="success"; fi
            gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
              -f "state=$state" \
              -f "context=$context" \
              -f "description=$outcome" > /dev/null
          }

          post_status legacy-printer-preview-resolve "$RELEASE_OUTCOME"
          post_status legacy-printer-preview-download "$DOWNLOAD_OUTCOME"
          post_status legacy-printer-preview-commit "$COMMIT_OUTCOME"

      - name: Dispatch VPS preview after printer update
        if: ${{ steps.commit_preview.outputs.updated == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(curl -fsS --retry 2 --max-time 10 https://johnvitor.com/api/preview-deploy-status)" || {
            echo '::warning::Phone toggle unavailable; deployment not dispatched'
            exit 0
          }
          if [[ "$state" != ON ]]; then
            echo "Preview deployment OFF; not dispatching"
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/actions/workflows/deploy-vps-preview.yml/dispatches" -f ref=preview
