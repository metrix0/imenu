name: Sync preview with main

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - printer-release
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-preview:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-preview-reset]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync preview to main
        run: git push origin HEAD:preview --force

  sync-printer-release:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[sync-printer]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Resolve printer release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_RELEASE_URL: ${{ github.event.client_payload.release_url }}
          PAYLOAD_UPDATED_AT: ${{ github.event.client_payload.updated_at }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -n "${PAYLOAD_VERSION:-}" ] && [ -n "${PAYLOAD_RELEASE_URL:-}" ]; then
            VERSION="$PAYLOAD_VERSION"
            RELEASE_URL="$PAYLOAD_RELEASE_URL"
            UPDATED_AT="${PAYLOAD_UPDATED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          else
            RELEASE_JSON="$(curl --fail --silent --show-error --location --retry 5 https://api.github.com/repos/metrix0/imenu-printer/releases/latest)"
            TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')"
            VERSION="${TAG#v}"
            FILE_NAME="iMenu Impressora Setup ${VERSION}.exe"
            RELEASE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$FILE_NAME" '.assets[] | select(.name == $name) | .browser_download_url' | head -n 1)"
            UPDATED_AT="$(printf '%s' "$RELEASE_JSON" | jq -r '.published_at // .created_at')"
          fi

          test -n "$VERSION"
          test "$VERSION" != "null"
          test -n "$RELEASE_URL"
          test "$RELEASE_URL" != "null"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"

      - name: Download installer and update metadata
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          UPDATED_AT: ${{ steps.release.outputs.updated_at }}
        run: |
          set -euo pipefail

          FILE_NAME="iMenu Impressora Setup ${VERSION}.exe"
          export FILE_NAME
          mkdir -p public/downloads

          curl --fail --location --retry 5 --retry-delay 3 "$RELEASE_URL" -o "public/downloads/$FILE_NAME"

          SIZE="$(stat -c%s "public/downloads/$FILE_NAME")"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Downloaded installer is unexpectedly small: $SIZE bytes"
            exit 1
          fi

          MAGIC="$(head -c 2 "public/downloads/$FILE_NAME")"
          if [ "$MAGIC" != "MZ" ]; then
            echo "Downloaded file is not a Windows executable."
            exit 1
          fi

          ENCODED_NAME="$(python - <<'PY'
import os, urllib.parse
print(urllib.parse.quote(os.environ['FILE_NAME']))
PY
          )"

          jq -n \
            --arg version "$VERSION" \
            --arg updatedAt "$UPDATED_AT" \
            --arg downloadUrl "/downloads/$ENCODED_NAME" \
            '{version:$version,updatedAt:$updatedAt,downloadUrl:$downloadUrl}' \
            > public/downloads/imenu-printer.json

      - name: Commit release to preview
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          FILE_NAME="iMenu Impressora Setup ${VERSION}.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000

          git add "public/downloads/$FILE_NAME" public/downloads/imenu-printer.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update printer download to ${VERSION}"

          for attempt in 1 2 3 4 5; do
            git fetch origin preview
            git rebase origin/preview

            if git -c http.version=HTTP/1.1 push origin HEAD:preview; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Could not push printer download update to preview after 5 attempts."
          exit 1
