name: Sync preview with main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync preview to main
        run: git push origin HEAD:preview --force
