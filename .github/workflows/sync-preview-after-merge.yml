name: Sync preview after merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  sync-preview:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'preview'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Reset preview to main
        run: git push origin HEAD:preview --force

      - name: Trigger VPS staging deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-vps-preview.yml --repo "${{ github.repository }}" --ref preview
