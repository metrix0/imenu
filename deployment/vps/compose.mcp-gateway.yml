name: imenu-stage-mcp-gateway
services:
  gateway:
    image: caddy@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    container_name: imenu-stage-mcp-gateway
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    init: true
    volumes:
      - /opt/imenu-migration/ops/mcp-bridge/Caddyfile.gateway:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /config:rw,noexec,nosuid,size=8m,uid=1000,gid=1000
      - /data:rw,noexec,nosuid,size=8m,uid=1000,gid=1000
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      supabase:
        ipv4_address: 172.18.254.2
networks:
  supabase:
    external: true
    name: imenu-stage_default
