name: imenu-production
services:
  app:
    image: imenu-production-app:final
    container_name: imenu-production-app
    restart: unless-stopped
    init: true
    env_file:
      - path: /opt/imenu-migration/secrets/app-production.env
        format: raw
    networks: [supabase, egress]
    ports: ["127.0.0.1:23000:3000"]
    mem_limit: 2g
    cpus: 3
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 15s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  supabase:
    external: true
    name: imenu-stage_default
  egress:
    external: true
    name: imenu-stage-proxy_acme
